  <style>
    :root {
      --surface:#0b1729; --panel:#14243a; --raised:#1b3049;
      --accent:#a9ee72; --ink:#f3f7fc; --muted:#aebed0;
      --line:#30445b; --warning:#ffcb73;

    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body { margin:0; color:var(--ink); font-family:"DM Sans",sans-serif; }
    .app-shell {
      width:100%; min-height:calc(100 * min(var(--vh, 1vh), 1vh));

    .schedule-card.finished { border-color:#344254; }

    .schedule-time { font:700 17px/1.3 "Space Mono",monospace; letter-spacing:-.055em; white-space:nowrap; }
    .status-tag {

    .status-tag.active { background:var(--accent); color:#112417; }
    .status-tag.finished { background:#283b4f; color:#b9c8d5; }
    .conflict-tag { color:var(--warning); font-size:11px; font-weight:700; }

    @media (max-width:1100px) {

    }
  </style>

  <script>
    const SOURCE = {
      apiUrl:"https://script.google.com/macros/s/AKfycbx2t8ON6uImcs64mASJk3-0lyr34h5-Hkk2fafekLLPe87-9PtREWwRmqD4RxuylGQS/exec",
      timeZone:"Asia/Jakarta",
      refreshIntervalMs:30000
    };
    const $ = id => document.getElementById(id);
    const state = { rows:[], loaded:false, fetching:false, dayKey:"", lastUpdated:null };
    const dateFormatter = new Intl.DateTimeFormat("id-ID",{
      timeZone:SOURCE.timeZone,weekday:"long",day:"numeric",month:"long",year:"numeric"
    });
    const partsFormatter = new Intl.DateTimeFormat("en-GB",{
      timeZone:SOURCE.timeZone,year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
    });
    const timeFormatter = new Intl.DateTimeFormat("id-ID",{
      timeZone:SOURCE.timeZone,hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
    });
    function parts(date) {
      return Object.fromEntries(partsFormatter.formatToParts(date)
        .filter(part => part.type !== "literal").map(part => [part.type,part.value]));
    }
    function dayKey(date) {
      const p=parts(date);
      return `${p.year}-${p.month}-${p.day}`;
    }
    function minutesNow(date) {
      const p=parts(date);
      return Number(p.hour)*60+Number(p.minute)+Number(p.second)/60;
    }
    function parseDate(value) {
      const text=String(value ?? "").trim();
      let m=text.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)/i);
      if(m) return `${m[1]}-${String(Number(m[2])+1).padStart(2,"0")}-${m[3].padStart(2,"0")}`;
      m=text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\b|T)/);
      if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
      m=text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m) return `${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
      m=text.match(/^(\d{1,2})[.-](\d{1,2})[.-](\d{4})/);
      if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
      return "";
    }
    function parseTime(value) {
      const text=String(value ?? "").trim();
      let m=text.match(/^Date\(\d{4},\s*\d{1,2},\s*\d{1,2},\s*(\d{1,2}),\s*(\d{1,2})/i);
      if(m) return Number(m[1])*60+Number(m[2]);
      m=text.match(/^(\d{1,2})[:.](\d{2})(?::\d{2})?\s*(AM|PM)?/i);
      if(!m) return null;
      let h=Number(m[1]), min=Number(m[2]);
      if(min>59 || h>(m[3]?12:23) || (m[3] && h<1)) return null;
      if(m[3]) h=h%12+(m[3].toUpperCase()==="PM"?12:0);
      return h*60+min;
    }
    function timeText(value) {
      return `${String(Math.floor(value/60)).padStart(2,"0")}:${String(value%60).padStart(2,"0")}`;
    }
    function sourceRows(payload) {
      if(Array.isArray(payload)) return payload;
      for(const key of ["data","rows","result","records","items"])
        if(Array.isArray(payload?.[key])) return payload[key];
      throw new Error("Format data jadwal tidak dikenali.");
    }
    function normalize(payload) {
      const pick=(item,names)=>{
        const key=Object.keys(item||{}).find(k=>names.includes(k.toLowerCase().replace(/[\s_-]/g,"")));
        return key ? item[key] : "";
      };
      return sourceRows(payload).map((item,index)=>{
        const date=parseDate(pick(item,["tanggal","date","hari"]));
        const start=parseTime(pick(item,["waktumulai","jammulai","start","starttime"]));
        const end=parseTime(pick(item,["waktuselesai","jamselesai","end","endtime"]));
        if(!date || start===null || end===null || end<=start) return null;
        return {
          id:`${index}-${date}-${start}-${end}`,date,start,end,
          teacher:String(pick(item,["teacher","namaguru","namapemesan","guru","pemesan","nama"])||"").trim(),
          subject:String(pick(item,["subject","matapelajaran","kegiatan","activity","acara"])||"").trim(),
          note:String(pick(item,["note","keterangan","catatan"])||"").trim(),
          timestamp:String(pick(item,["timestamp","waktupengisian","submittedat","submissiontimestamp"])||"").trim()
        };
      }).filter(Boolean);
    }
    function timestampValue(value) {
      const text=String(value||"").trim();
      if(!text) return Number.POSITIVE_INFINITY;
      const parsed=Date.parse(text);
      if(!Number.isNaN(parsed)) return parsed;
      const match=text.match(/(\d{1,2})[:.](\d{2})(?::(\d{2}))?/);
      if(match) return Number(match[1])*3600000+Number(match[2])*60000+Number(match[3]||0)*1000;
      return Number.POSITIVE_INFINITY;
    }
    function conflictState(rows) {
      const byTimestamp=[...rows].sort((a,b)=>timestampValue(a.timestamp)-timestampValue(b.timestamp));
      const priorityIds=new Set(), conflictIds=new Set();
      byTimestamp.forEach(row=>{
        const earlier=byTimestamp.some(other=>other!==row && timestampValue(other.timestamp)<timestampValue(row.timestamp) &&
          other.start<row.end && row.start<other.end);
        if(earlier) conflictIds.add(row.id);
        else if(byTimestamp.some(other=>other!==row && other.start<row.end && row.start<other.end)) priorityIds.add(row.id);
      });
      return {priorityIds,conflictIds};
    }
    function setText(element,text) {
      if(element.textContent!==text) element.textContent=text;
    }
    function showMessage(text,error=false) {
      const el=$("message");
      setText(el,text);
      el.classList.toggle("hidden",!text);
      el.style.color=error?"var(--warning)":"var(--muted)";
    }
    function render() {
      const now=minutesNow(new Date());
      const rows=state.rows.filter(row=>row.date===state.dayKey)
        .sort((a,b)=>a.start-b.start || a.end-b.end);
      setText($("schedule-count"),`${rows.length} jadwal hari ini`);
      $("empty-state").classList.toggle("hidden",!state.loaded || rows.length!==0);
      const active=rows.filter(row=>row.start<=now && now<row.end);
      const next=rows.find(row=>row.start>now);
      const conflicts=conflictState(rows);
      setText($("room-status"),!state.loaded?"JADWAL BELUM TERSEDIA":
        active.length?"SEDANG DIGUNAKAN":next?"BOOKING BERIKUTNYA":"TERSEDIA");
      setText($("status-detail"),!state.loaded?"Menunggu data jadwal.":
        active.length
  ? active
      .map(
        row =>
          `${row.teacher || "Nama guru tidak tercantum"} - ${row.subject || "Kegiatan tidak tercantum"}`
      )
      .join("  |  "):
        next?`${timeText(next.start)} — ${next.subject||next.teacher}`:
        "Tidak ada jadwal berikutnya hari ini.");
      $("room-status").style.color=active.length?"var(--accent)":"var(--ink)";

      const list=$("schedule-list");
      const existing=new Map([...list.children].map(card=>[card.dataset.rowId,card]));
      rows.forEach((row,index)=>{
        let card=existing.get(row.id);
        if(!card) {
          card=$("schedule-template").content.firstElementChild.cloneNode(true);
          card.dataset.rowId=row.id;
        }
        const isActive=row.start<=now && now<row.end;
        const finished=row.end<=now;
        card.classList.toggle("active",isActive);
        card.classList.toggle("finished",finished);
        setText(card.querySelector(".schedule-time"),`${timeText(row.start)} - ${timeText(row.end)}`);
        setText(card.querySelector(".schedule-person"),
          `${row.teacher||"Nama guru tidak tercantum"} - ${row.subject||"Mata pelajaran tidak tercantum"}`);
        const tag=card.querySelector(".status-tag");
        setText(tag,finished?"SELESAI":isActive?"SEDANG BERLANGSUNG":
          row.id===next?.id?"BERIKUTNYA":"TERJADWAL");
        tag.classList.toggle("active",isActive);
        tag.classList.toggle("finished",finished);
        const note=card.querySelector(".schedule-note");
        setText(note,row.note);
        note.classList.toggle("hidden",!row.note);
        const isPriority=conflicts.priorityIds.has(row.id);
        const isConflict=conflicts.conflictIds.has(row.id);
        const priorityTag=card.querySelector(".priority-tag");
        const conflictTag=card.querySelector(".conflict-tag");
        const conflictNote=card.querySelector(".conflict-note");
        setText(priorityTag,"★ PRIORITAS");
        setText(conflictTag,"⚠ BENTROK");
        setText(conflictNote,isPriority?"Booking lebih awal":isConflict?"Booking bertabrakan dengan jadwal prioritas":"");
        priorityTag.classList.toggle("hidden",!isPriority);
        conflictTag.classList.toggle("hidden",!isConflict);
        conflictNote.classList.toggle("hidden",!isPriority && !isConflict);
        if(list.children[index]!==card) list.insertBefore(card,list.children[index]||null);
        existing.delete(row.id);
      });
      existing.forEach(card=>card.remove());
    }
    async function refresh() {
      if(state.fetching) return;
      state.fetching=true;
      const button=$("refresh-btn");
      button.disabled=true;
      if(!state.loaded) showMessage("Mengambil data jadwal…");
      try {
        const response=await fetch(SOURCE.apiUrl,{method:"GET",redirect:"follow",cache:"no-store"});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload=await response.json();
        state.rows=normalize(payload);
        state.loaded=true;
        state.lastUpdated=new Date();
        setText($("last-update"),`Diperbarui ${timeFormatter.format(state.lastUpdated).replace(/\./g,":")} WIB`);
        showMessage("");
        render();
      } catch {
        showMessage(state.loaded?
          "Pembaruan gagal. Jadwal terakhir tetap ditampilkan.":
          "Jadwal tidak dapat dimuat. Tekan Perbarui untuk mencoba lagi.",true);
        render();
      } finally {
        state.fetching=false;
        button.disabled=false;
      }
    }
    function tick() {
      const now=new Date();
      setText($("clock"),timeFormatter.format(now).replace(/\./g,":"));
      setText($("today-label"),dateFormatter.format(now));
      const today=dayKey(now);
      if(today!==state.dayKey) {
        state.dayKey=today;
        render();
        if(state.loaded) refresh();
      } else if(state.loaded) render();
    }
    document.addEventListener("DOMContentLoaded",()=>{
      state.dayKey=dayKey(new Date());
      $("refresh-btn").addEventListener("click",refresh);
      $("fullscreen-btn").addEventListener("click",async()=>{
        try {
          if(document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
          showMessage("");
        } catch {
          showMessage("Mode layar penuh tidak tersedia pada tampilan ini.",true);
        }
      });
      tick();
      refresh();
      setInterval(tick,1000);
      setInterval(refresh,SOURCE.refreshIntervalMs);
      if(window.lucide) lucide.createIcons();
    });
  </script>
  

 </body>
